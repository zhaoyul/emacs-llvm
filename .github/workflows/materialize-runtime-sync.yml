name: Materialize Runtime Sync

on:
  push:
    branches:
      - codex/runtime-sync-20260921
    paths:
      - .bootstrap/READY
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve repository-native additions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/overlay"
          files=(
            .github/ci/linux-package-acceptance.el
            .github/workflows/build-release-artifacts.yml
            .github/workflows/linux-package-runtime-experimental.yml
            .github/workflows/remote-publication-verification.yml
            docs/github-publication-and-artifacts.md
          )
          for file in "${files[@]}"; do
            if [[ -f "$file" ]]; then
              mkdir -p "$RUNNER_TEMP/overlay/$(dirname "$file")"
              cp -a "$file" "$RUNNER_TEMP/overlay/$file"
            fi
          done

      - name: Verify and extract clean alpha.16 source
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/emacs-operator-alpha16-clean.tar.xz"
          cat .bootstrap/full-alpha16/part-* > "$archive"
          echo "1f90d7580146172550afbafc8d8b91e3456bff6b0a26175588cc0b14fb542496  $archive" | sha256sum --check --strict
          xz --test "$archive"
          mkdir -p "$RUNNER_TEMP/source"
          tar -xJf "$archive" -C "$RUNNER_TEMP/source"
          test "$(find "$RUNNER_TEMP/source" -type f | wc -l)" -eq 366
          test -f "$RUNNER_TEMP/source/package.json"
          test "$(node -p "require('$RUNNER_TEMP/source/package.json').version")" = "0.1.0-alpha.16"

      - name: Overlay repository-native additions
        shell: bash
        run: |
          set -euo pipefail
          cp -a "$RUNNER_TEMP/overlay/." "$RUNNER_TEMP/source/"

      - name: Replace migration branch worktree
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          import shutil

          root = Path(".").resolve()
          source = Path(os.environ["RUNNER_TEMP"]) / "source"

          for item in root.iterdir():
              if item.name == ".git":
                  continue
              if item.is_dir() and not item.is_symlink():
                  shutil.rmtree(item)
              else:
                  item.unlink()

          for item in source.iterdir():
              target = root / item.name
              if item.is_dir():
                  shutil.copytree(item, target, symlinks=False)
              else:
                  shutil.copy2(item, target)
          PY

          rm -rf .bootstrap
          rm -f .github/workflows/materialize-runtime-sync.yml

      - name: Validate materialized source
        shell: bash
        run: |
          set -euo pipefail
          node scripts/sync-version.mjs --check
          python3 scripts/check-elisp-structure.py
          test "$(node -p 'require("./package.json").version')" = "0.1.0-alpha.16"
          test -f .github/workflows/ci.yml
          test -f .github/workflows/build-release-artifacts.yml
          test -f .github/workflows/linux-package-runtime-experimental.yml
          test -f .github/workflows/remote-publication-verification.yml
          test -x scripts/accept-linux.sh
          git diff --check

      - name: Commit materialized source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: materialize Emacs Operator 0.1.0-alpha.16 source baseline"
          git push origin HEAD:codex/runtime-sync-20260921
