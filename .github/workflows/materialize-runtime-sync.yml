name: Materialize Runtime Sync

on:
  workflow_dispatch:
  push:
    branches:
      - codex/runtime-sync-20260921
    paths:
      - .bootstrap/READY

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve repository-native additions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/repo-native"
          files=(
            .github/ci/linux-package-acceptance.el
            .github/workflows/build-release-artifacts.yml
            .github/workflows/linux-package-runtime-experimental.yml
            .github/workflows/remote-publication-verification.yml
            docs/github-publication-and-artifacts.md
            docs/package-runtime-provenance.md
          )
          for file in "${files[@]}"; do
            if [[ -f "$file" ]]; then
              mkdir -p "$RUNNER_TEMP/repo-native/$(dirname "$file")"
              cp "$file" "$RUNNER_TEMP/repo-native/$file"
            fi
          done

      - name: Reconstruct and inspect clean alpha16 archive
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(.bootstrap/full-alpha16/part-*)
          if [[ ${#parts[@]} -eq 0 ]]; then
            echo "No staged clean alpha16 archive parts found." >&2
            exit 1
          fi

          archive="$RUNNER_TEMP/emacs-operator-alpha16-clean.tar.xz"
          : > "$archive"
          cat "${parts[@]}" > "$archive"

          expected_sha="$(awk -F= '$1 == "clean_archive_sha256" { print $2 }' .bootstrap/READY)"
          actual_sha="$(sha256sum "$archive" | awk '{ print $1 }')"
          expected_bytes="$(awk -F= '$1 == "clean_archive_bytes" { print $2 }' .bootstrap/READY)"
          actual_bytes="$(stat -c '%s' "$archive")"

          printf 'archive_parts=%s\n' "${#parts[@]}"
          printf 'archive_bytes_expected=%s\n' "$expected_bytes"
          printf 'archive_bytes_actual=%s\n' "$actual_bytes"
          printf 'archive_sha256_expected=%s\n' "$expected_sha"
          printf 'archive_sha256_actual=%s\n' "$actual_sha"

          if [[ "$actual_bytes" != "$expected_bytes" ]]; then
            echo "Archive byte length differs from the staged lock." >&2
            exit 1
          fi
          if [[ "$actual_sha" != "$expected_sha" ]]; then
            echo "::warning::Archive SHA differs from the historical deterministic lock; source-level MANIFEST verification will be authoritative."
          fi

          xz --test "$archive"
          tar -tJf "$archive" >/dev/null

          extracted="$RUNNER_TEMP/extracted"
          mkdir -p "$extracted"
          tar -xJf "$archive" -C "$extracted"

          if [[ -f "$extracted/package.json" ]]; then
            source_root="$extracted"
          else
            mapfile -t candidate_roots < <(find "$extracted" -mindepth 1 -maxdepth 1 -type d -print)
            source_root=""
            for candidate in "${candidate_roots[@]}"; do
              if [[ -f "$candidate/package.json" ]]; then
                if [[ -n "$source_root" ]]; then
                  echo "Multiple extracted source roots contain package.json." >&2
                  exit 1
                fi
                source_root="$candidate"
              fi
            done
            if [[ -z "$source_root" ]]; then
              echo "No extracted source root contains package.json." >&2
              exit 1
            fi
          fi

          version="$(node -p "require('$source_root/package.json').version")"
          source_files="$(find "$source_root" -type f | wc -l)"
          printf 'source_root=%s\n' "$source_root"
          printf 'source_version=%s\n' "$version"
          printf 'source_files=%s\n' "$source_files"

          test "$version" = "0.1.0-alpha.16"
          test "$source_files" = "366"

          echo "EMACS_OPERATOR_RECOVERED_SOURCE=$source_root" >> "$GITHUB_ENV"
          echo "EMACS_OPERATOR_RECONSTRUCTED_ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Verify all recovered source files against published MANIFEST
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          import os
          import stat
          from pathlib import Path

          source = Path(os.environ["EMACS_OPERATOR_RECOVERED_SOURCE"]).resolve()
          manifest_path = Path(".bootstrap/emacs-operator-alpha16-MANIFEST.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))

          excluded_prefixes = ("apps/linux-host/build/",)
          expected = {}
          for entry in manifest["files"]:
              rel = entry["path"]
              if any(rel.startswith(prefix) for prefix in excluded_prefixes):
                  continue
              expected[rel] = entry

          actual = {
              path.relative_to(source).as_posix()
              for path in source.rglob("*")
              if path.is_file()
          }

          missing = sorted(set(expected) - actual)
          extra = sorted(actual - set(expected))
          mismatches = []

          for rel, entry in sorted(expected.items()):
              path = source / rel
              if not path.is_file():
                  continue
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              mode = oct(stat.S_IMODE(path.stat().st_mode))
              if digest != entry["sha256"] or mode != entry["mode"]:
                  mismatches.append({
                      "path": rel,
                      "sha256_expected": entry["sha256"],
                      "sha256_actual": digest,
                      "mode_expected": entry["mode"],
                      "mode_actual": mode,
                  })

          print(f"manifest_expected_files={len(expected)}")
          print(f"manifest_actual_files={len(actual)}")
          print(f"manifest_missing={len(missing)}")
          print(f"manifest_extra={len(extra)}")
          print(f"manifest_mismatches={len(mismatches)}")

          if missing:
              print("missing_files=" + json.dumps(missing[:20], ensure_ascii=False))
          if extra:
              print("extra_files=" + json.dumps(extra[:20], ensure_ascii=False))
          if mismatches:
              print("mismatches=" + json.dumps(mismatches[:20], ensure_ascii=False))

          assert len(expected) == 366, len(expected)
          assert not missing
          assert not extra
          assert not mismatches
          PY

      - name: Upload reconstructed clean archive for diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staged-alpha16-clean-${{ github.run_id }}
          path: ${{ env.EMACS_OPERATOR_RECONSTRUCTED_ARCHIVE }}
          if-no-files-found: warn
          retention-days: 7

      - name: Merge repository-native additions into recovered source
        shell: bash
        run: |
          set -euo pipefail
          source_root="$EMACS_OPERATOR_RECOVERED_SOURCE"
          if [[ -d "$RUNNER_TEMP/repo-native" ]]; then
            cp -a "$RUNNER_TEMP/repo-native/." "$source_root/"
          fi
          rm -rf "$source_root/.bootstrap"
          rm -f "$source_root/.github/workflows/materialize-runtime-sync.yml"

      - name: Replace recovery branch worktree
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          import shutil

          root = Path('.').resolve()
          source = Path(os.environ["EMACS_OPERATOR_RECOVERED_SOURCE"]).resolve()

          for item in root.iterdir():
              if item.name == '.git':
                  continue
              if item.is_dir() and not item.is_symlink():
                  shutil.rmtree(item)
              else:
                  item.unlink()

          for item in source.iterdir():
              target = root / item.name
              if item.is_dir():
                  shutil.copytree(item, target, symlinks=False)
              else:
                  shutil.copy2(item, target)
          PY

      - name: Validate recovered alpha16 source before commit
        shell: bash
        run: |
          set -euo pipefail
          node scripts/sync-version.mjs --check
          python3 scripts/check-elisp-structure.py
          test "$(node -p 'require("./package.json").version')" = "0.1.0-alpha.16"
          test -f .github/workflows/ci.yml
          test -f .github/workflows/build-release-artifacts.yml
          test -f .github/workflows/linux-package-runtime-experimental.yml
          test -f .github/workflows/remote-publication-verification.yml
          test ! -e .bootstrap

      - name: Commit materialized alpha16 tree to recovery branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: materialize verified Emacs Operator 0.1.0-alpha.16 source"
          git push origin HEAD:codex/runtime-sync-20260921
