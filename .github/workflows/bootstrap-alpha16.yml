name: bootstrap-alpha16-source

on:
  push:
    branches:
      - codex/import-alpha16-source-final
    paths:
      - .bootstrap/READY
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve repository-native CI additions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/repo-native"
          files=(
            .github/ci/linux-package-acceptance.el
            .github/workflows/build-release-artifacts.yml
            .github/workflows/linux-package-runtime-experimental.yml
            .github/workflows/remote-publication-verification.yml
            docs/github-publication-and-artifacts.md
          )
          for file in "${files[@]}"; do
            if [[ -f "$file" ]]; then
              mkdir -p "$RUNNER_TEMP/repo-native/$(dirname "$file")"
              cp "$file" "$RUNNER_TEMP/repo-native/$file"
            fi
          done

      - name: Reconstruct locked alpha.16 source archive
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(.bootstrap/part-??? )
          if [[ ${#parts[@]} -eq 0 ]]; then
            echo "No bootstrap parts found" >&2
            exit 1
          fi
          printf 'bootstrap_parts=%s\n' "${#parts[@]}"
          cat "${parts[@]}" > "$RUNNER_TEMP/emacs-operator-alpha16.tar.xz.b64"
          base64 --decode "$RUNNER_TEMP/emacs-operator-alpha16.tar.xz.b64" > "$RUNNER_TEMP/emacs-operator-alpha16.tar.xz"
          echo "1967f1b7376fb6fa8a783aac9de67245258ef29356a399d826cac9c93d8e4a9c  $RUNNER_TEMP/emacs-operator-alpha16.tar.xz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/source"
          tar -xJf "$RUNNER_TEMP/emacs-operator-alpha16.tar.xz" -C "$RUNNER_TEMP/source"
          test -f "$RUNNER_TEMP/source/package.json"
          version="$(node -p "require('$RUNNER_TEMP/source/package.json').version")"
          test "$version" = "0.1.0-alpha.16"
          printf 'source_version=%s\n' "$version"
          printf 'source_files=%s\n' "$(find "$RUNNER_TEMP/source" -type f | wc -l)"

      - name: Merge repository-native CI additions into recovered source
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d "$RUNNER_TEMP/repo-native" ]]; then
            cp -a "$RUNNER_TEMP/repo-native/." "$RUNNER_TEMP/source/"
          fi
          rm -rf "$RUNNER_TEMP/source/.bootstrap"
          rm -f "$RUNNER_TEMP/source/.github/workflows/bootstrap-alpha16.yml"

      - name: Replace migration branch worktree
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import shutil

          root = Path('.').resolve()
          source = Path('${{ runner.temp }}/source').resolve()

          for item in root.iterdir():
              if item.name == '.git':
                  continue
              if item.is_dir() and not item.is_symlink():
                  shutil.rmtree(item)
              else:
                  item.unlink()

          for item in source.iterdir():
              target = root / item.name
              if item.is_dir():
                  shutil.copytree(item, target, symlinks=False)
              else:
                  shutil.copy2(item, target)
          PY

      - name: Validate recovered source before commit
        shell: bash
        run: |
          set -euo pipefail
          node scripts/sync-version.mjs --check
          python3 scripts/check-elisp-structure.py
          test "$(node -p 'require("./package.json").version')" = "0.1.0-alpha.16"
          test -f .github/workflows/ci.yml
          test -f .github/workflows/build-release-artifacts.yml
          test -f .github/workflows/linux-package-runtime-experimental.yml
          test -f .github/workflows/remote-publication-verification.yml
          test ! -e .bootstrap

      - name: Commit imported alpha.16 tree to migration branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: import Emacs Operator 0.1.0-alpha.16 source baseline"
          git push origin HEAD:codex/import-alpha16-source-final
