name: materialize-alpha16-with-alpha18-runtime

on:
  push:
    branches:
      - codex/import-alpha16-source-final
    paths:
      - .bootstrap/alpha16-clean/READY
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check bootstrap tools
        shell: bash
        run: |
          set -euo pipefail
          for tool in base64 patch python3 sha256sum tar xz git node; do
            command -v "$tool" >/dev/null
          done

      - name: Reconstruct verified Alpha.16 clean source
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mapfile -t parts < <(printf '%s\n' .bootstrap/alpha16-clean/part-*.txt | sort)
          test "${#parts[@]}" -eq 25

          encoded="$RUNNER_TEMP/alpha16-clean.tar.xz.b64"
          archive="$RUNNER_TEMP/alpha16-clean.tar.xz"
          : > "$encoded"
          for part in "${parts[@]}"; do
            cat "$part" >> "$encoded"
          done

          echo "1834d0c7d1fdeb4ec7b68e5d433d91082db2425c00e8748dcdfb057dbff5d3d8  $encoded" | sha256sum --check --strict
          base64 --decode "$encoded" > "$archive"
          echo "dcf961659891cc24a05ca8d24a702f70a30aed91767ed6338c13206cd1c65416  $archive" | sha256sum --check --strict
          xz --test "$archive"
          tar -tJf "$archive" >/dev/null

          mkdir -p "$RUNNER_TEMP/source"
          tar -xJf "$archive" -C "$RUNNER_TEMP/source"
          test -f "$RUNNER_TEMP/source/package.json"
          test "$(node -p "require('$RUNNER_TEMP/source/package.json').version")" = "0.1.0-alpha.16"
          test "$(find "$RUNNER_TEMP/source" -type f | wc -l)" -eq 366
          test ! -e "$RUNNER_TEMP/source/apps/linux-host/build"

      - name: Reconstruct verified Alpha.18 runtime capsule
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mapfile -t parts < <(printf '%s\n' .bootstrap/alpha18-runtime/part-*.txt | sort)
          test "${#parts[@]}" -eq 4

          encoded="$RUNNER_TEMP/alpha18-runtime.patch.xz.b64"
          compressed="$RUNNER_TEMP/alpha18-runtime.patch.xz"
          patch_file="$RUNNER_TEMP/alpha18-runtime.patch"

          : > "$encoded"
          for part in "${parts[@]}"; do
            cat "$part" >> "$encoded"
          done

          echo "f82c23b4ba9f0f0e72696f1b7688bf7e19d34fe72341df934a17681f5ff544dc  $encoded" | sha256sum --check --strict
          base64 --decode "$encoded" > "$compressed"
          echo "d1aa97c69c90fe6974d155f53540ea9736be1ac7ff6011c18b557d4e21f7de54  $compressed" | sha256sum --check --strict
          xz --test "$compressed"
          xz --decompress --stdout "$compressed" > "$patch_file"
          echo "9e9d704089ecc2cad4ccaf47ed7b646c8fecc0e3c11cb276e09940d5670188ac  $patch_file" | sha256sum --check --strict

          cp .bootstrap/alpha18-runtime/capsule-manifest.json "$RUNNER_TEMP/capsule-manifest.json"

      - name: Apply Alpha.18 runtime patch
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/source"
          patch --batch --dry-run -p5 < "$RUNNER_TEMP/alpha18-runtime.patch"
          patch --batch -p5 < "$RUNNER_TEMP/alpha18-runtime.patch"

      - name: Verify capsule file hashes
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_ROOT="$RUNNER_TEMP/source" MANIFEST="$RUNNER_TEMP/capsule-manifest.json" python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["SOURCE_ROOT"])
          manifest = json.loads(Path(os.environ["MANIFEST"]).read_text())
          failures = []
          for entry in manifest["changed_files"]:
              path = root / entry["path"]
              expected = entry["after"]
              if not path.is_file():
                  failures.append(f"missing: {entry['path']}")
                  continue
              data = path.read_bytes()
              actual_sha = hashlib.sha256(data).hexdigest()
              if len(data) != expected["bytes"] or actual_sha != expected["sha256"]:
                  failures.append(
                      f"mismatch: {entry['path']} bytes={len(data)} sha256={actual_sha}"
                  )
          if failures:
              raise SystemExit("\n".join(failures))
          print(f"capsule_hashes=PASS files={len(manifest['changed_files'])}")
          PY

      - name: Validate materialized source
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/source"
          node scripts/sync-version.mjs --check
          python3 scripts/check-elisp-structure.py
          npm run test:package-runtime
          bash -n scripts/*.sh
          test -f .github/workflows/ci.yml
          test -f .github/workflows/linux-package-runtime-experimental.yml
          test "$(node -p 'require("./package.json").version')" = "0.1.0-alpha.16"

      - name: Replace migration branch worktree
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_ROOT="$RUNNER_TEMP/source" python3 - <<'PY'
          from pathlib import Path
          import os
          import shutil

          root = Path(".").resolve()
          source = Path(os.environ["SOURCE_ROOT"]).resolve()

          for item in root.iterdir():
              if item.name == ".git":
                  continue
              if item.is_dir() and not item.is_symlink():
                  shutil.rmtree(item)
              else:
                  item.unlink()

          for item in source.iterdir():
              target = root / item.name
              if item.is_dir():
                  shutil.copytree(item, target, symlinks=False)
              else:
                  shutil.copy2(item, target)
          PY

      - name: Commit materialized source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: materialize alpha16 source with alpha18 runtime"
          git push origin HEAD:codex/import-alpha16-source-final
