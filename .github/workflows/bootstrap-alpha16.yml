name: bootstrap-alpha16-source

on:
  push:
    branches: [main]
    paths:
      - .bootstrap/READY

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct locked source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part-* > "$RUNNER_TEMP/emacs-operator-alpha16.tar.xz.b64"
          base64 --decode "$RUNNER_TEMP/emacs-operator-alpha16.tar.xz.b64" > "$RUNNER_TEMP/emacs-operator-alpha16.tar.xz"
          echo "1967f1b7376fb6fa8a783aac9de67245258ef29356a399d826cac9c93d8e4a9c  $RUNNER_TEMP/emacs-operator-alpha16.tar.xz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/source"
          tar -xJf "$RUNNER_TEMP/emacs-operator-alpha16.tar.xz" -C "$RUNNER_TEMP/source"

      - name: Replace repository tree
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import shutil

          root = Path('.').resolve()
          source = Path('${{ runner.temp }}/source').resolve()

          for item in root.iterdir():
              if item.name == '.git':
                  continue
              if item.is_dir() and not item.is_symlink():
                  shutil.rmtree(item)
              else:
                  item.unlink()

          for item in source.iterdir():
              target = root / item.name
              if item.is_dir():
                  shutil.copytree(item, target, symlinks=False)
              else:
                  shutil.copy2(item, target)
          PY

      - name: Commit imported alpha.16 tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: import Emacs Operator 0.1.0-alpha.16"
          git push origin HEAD:main
