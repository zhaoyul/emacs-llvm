name: Linux Package Runtime

# Hard Paredit/CIDER/SLY gate against real runtimes. Every Emacs package is
# acquired at an exact commit (scripts/package-runtime/sources.lock.json) and
# every JVM jar is SHA-256 pinned (scripts/package-runtime/jvm.lock.json);
# Ubuntu's apt set is not used for packages because 24.04 lacks elpa-cider /
# elpa-sly and ships clojure-mode/compat below CIDER 2.0.1's requirements.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install GNU Emacs, X11, SBCL and a JRE
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential emacs-gtk libx11-dev libpng-dev libxtst6 xvfb x11-utils sbcl openjdk-21-jre-headless
      - name: Install locked TypeScript toolchain
        run: npm install --no-save --package-lock=false --ignore-scripts typescript@5.9.2
      - name: Provision and start pinned package runtimes
        run: |
          bash scripts/package-runtime/start-package-runtimes.sh "$RUNNER_TEMP/package-runtime"
          cat "$RUNNER_TEMP/package-runtime/package-runtime.env" >> "$GITHUB_ENV"
      - name: Run hard Linux package acceptance
        env:
          EMACS_OPERATOR_LINUX_REQUIRE_EMACS: "1"
          EMACS_OPERATOR_LINUX_REQUIRE_GUI_EMACS: "1"
          EMACS_OPERATOR_LINUX_REQUIRE_PAREDIT: "1"
          EMACS_OPERATOR_LINUX_REQUIRE_CIDER: "1"
          EMACS_OPERATOR_LINUX_REQUIRE_SLY: "1"
          EMACS_OPERATOR_LINUX_RUN_BENCHMARKS: "0"
        run: npm run accept:linux
      - name: Stop package runtimes
        if: always()
        run: bash scripts/package-runtime/stop-package-runtimes.sh "$RUNNER_TEMP/package-runtime"
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-package-runtime-${{ github.run_id }}
          path: |
            dist/acceptance/
            ${{ runner.temp }}/package-runtime/*.log
            ${{ runner.temp }}/package-runtime/package-runtime.env
          if-no-files-found: warn
          retention-days: 14
