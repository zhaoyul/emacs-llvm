name: Linux Package Runtime Experimental

on:
  workflow_dispatch:
  push:
    branches:
      - codex/import-alpha16-source-final
    paths:
      - "lisp/**"
      - "apps/linux-host/**"
      - "packages/mcp-server/**"
      - "scripts/package-runtime/**"
      - "scripts/runtime/**"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/linux-package-runtime-experimental.yml"

permissions:
  contents: read

jobs:
  package-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Linux acceptance build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential emacs-gtk libx11-dev libpng-dev libxtst6 \
            xvfb x11-utils xauth dbus-x11 maven curl python3
      - name: Initialize Node workspace
        run: npm install --ignore-scripts
      - name: Validate portable source and runtime tooling
        run: |
          set -euo pipefail
          npm run check:version
          npm run typecheck
          npm run check:elisp-structure
          npm run test:package-runtime
      - name: Acquire locked Emacs package sources
        run: node scripts/package-runtime/acquire-package-runtime-sources.mjs
      - name: Assemble locked Emacs package runtime
        run: node scripts/package-runtime/prepare-package-runtime.mjs --nrepl-port 7888 --slynk-port 4005
      - name: Assemble offline CIDER JVM runtime
        run: node scripts/package-runtime/prepare-cider-jvm-runtime.mjs --out .runtime/cider-jvm
      - name: Provision private SBCL runtime
        run: node scripts/runtime/provision-sbcl-runtime.mjs --out .runtime/sbcl
      - name: Export runtime environment
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source .runtime/package-runtime/package-runtime.env
          set +a
          keys=(
            EMACS_OPERATOR_LINUX_EMACS_EXTRA_LOAD_PATHS
            EMACS_OPERATOR_LINUX_EMACS_SETUP_FILE
            EMACS_OPERATOR_LINUX_PACKAGE_RUNTIME_MANIFEST
            EMACS_OPERATOR_LINUX_PACKAGE_RUNTIME_PLAN_SHA256
            EMACS_OPERATOR_LINUX_PAREDIT_SOURCE_ROOT
            EMACS_OPERATOR_LINUX_CIDER_SOURCE_ROOT
            EMACS_OPERATOR_LINUX_SLY_SOURCE_ROOT
            EMACS_OPERATOR_CI_NREPL_PORT
            EMACS_OPERATOR_CI_SLYNK_PORT
          )
          for key in "${keys[@]}"; do printf '%s=%s\n' "$key" "${!key}" >> "$GITHUB_ENV"; done
          node --input-type=module <<'NODE' >> "$GITHUB_ENV"
          import fs from 'node:fs';
          import path from 'node:path';
          const cwd=process.cwd();
          const cider=JSON.parse(fs.readFileSync('.runtime/cider-jvm/cider-jvm-runtime-manifest.json','utf8'));
          const sbcl=JSON.parse(fs.readFileSync('.runtime/sbcl/sbcl-runtime-manifest.json','utf8'));
          console.log(`EMACS_OPERATOR_LINUX_CIDER_JVM_RUNTIME_MANIFEST=${path.join(cwd,'.runtime/cider-jvm/cider-jvm-runtime-manifest.json')}`);
          console.log(`EMACS_OPERATOR_LINUX_CIDER_JVM_RUNTIME_PLAN_SHA256=${cider.plan_sha256}`);
          console.log(`EMACS_OPERATOR_LINUX_SBCL_RUNTIME_MANIFEST=${path.join(cwd,'.runtime/sbcl/sbcl-runtime-manifest.json')}`);
          console.log(`EMACS_OPERATOR_LINUX_SBCL_RUNTIME_PLAN_SHA256=${sbcl.plan_sha256}`);
          NODE
      - name: Start real CIDER nREPL and SLY Slynk runtimes
        shell: bash
        run: |
          set -euo pipefail
          node scripts/package-runtime/start-cider-nrepl.mjs \
            --runtime .runtime/cider-jvm --port 7888 > nrepl.log 2>&1 &
          echo $! > nrepl.pid
          node scripts/package-runtime/start-slynk.mjs \
            --sly-source "$EMACS_OPERATOR_LINUX_SLY_SOURCE_ROOT" \
            --sbcl-runtime .runtime/sbcl --port 4005 > slynk.log 2>&1 &
          echo $! > slynk.pid
          for port in 7888 4005; do
            ready=0
            for _ in $(seq 1 160); do
              if (echo >/dev/tcp/127.0.0.1/$port) >/dev/null 2>&1; then ready=1; break; fi
              sleep .25
            done
            if [[ "$ready" != "1" ]]; then
              echo "Runtime port $port did not become ready" >&2
              cat nrepl.log >&2 || true
              cat slynk.log >&2 || true
              exit 1
            fi
          done
      - name: Run authoritative Linux package acceptance
        env:
          EMACS_OPERATOR_LINUX_PACKAGE_WAIT_MS: "30000"
          EMACS_OPERATOR_LINUX_REQUIRE_EMACS: "1"
          EMACS_OPERATOR_LINUX_REQUIRE_GUI_EMACS: "1"
          EMACS_OPERATOR_LINUX_REQUIRE_PAREDIT: "1"
          EMACS_OPERATOR_LINUX_REQUIRE_CIDER: "1"
          EMACS_OPERATOR_LINUX_REQUIRE_SLY: "1"
          EMACS_OPERATOR_LINUX_RUN_BENCHMARKS: "0"
        run: npm run accept:linux
      - name: Upload runtime and acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-package-runtime-${{ github.run_id }}
          path: |
            dist/acceptance/
            .runtime/package-runtime/package-runtime-manifest.json
            .runtime/cider-jvm/cider-jvm-runtime-manifest.json
            .runtime/sbcl/sbcl-runtime-manifest.json
            nrepl.log
            slynk.log
          if-no-files-found: warn
          retention-days: 14
